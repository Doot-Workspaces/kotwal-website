<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kotwal · thumbnail (600×600)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #d4cbbb; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .frame {
    width: 600px; height: 600px;
    position: relative;
    background: linear-gradient(135deg, #5C0F18 0%, #811622 60%, #F58634 100%);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 20px 60px -20px rgba(26,26,36,0.18);
  }
  /* Subtle pattern in background — paisley dots */
  .pattern { position: absolute; inset: 0; opacity: 0.07; }
  .pattern svg { width: 100%; height: 100%; }
  /* Shield with K */
  .shield-wrap { position: relative; margin-bottom: 18px; }
  .shield {
    width: 240px; height: 280px;
    background: #F5F1E8;
    clip-path: path('M120 0 L240 40 V140 C240 215 180 275 120 290 C60 275 0 215 0 140 V40 Z');
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .shield-k {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 180px; font-weight: 500;
    color: #811622;
    line-height: 1;
    margin-top: -10px;
  }
  /* Wordmark */
  .wordmark {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 56px; font-weight: 500; color: #F5F1E8;
    margin: 4px 0 0; letter-spacing: -0.5px;
  }
  .dv {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 28px; color: rgba(245,241,232,0.8);
    margin-top: 4px; letter-spacing: 1px;
  }
  .tag {
    position: absolute; bottom: 36px; left: 0; right: 0;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: rgba(245,241,232,0.65);
    letter-spacing: 4px; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="pattern">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
      <defs>
        <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
          <circle cx="30" cy="30" r="1.5" fill="#F5F1E8"/>
          <circle cx="0" cy="0" r="0.8" fill="#F5F1E8"/>
          <circle cx="60" cy="60" r="0.8" fill="#F5F1E8"/>
        </pattern>
      </defs>
      <rect width="600" height="600" fill="url(#dots)"/>
    </svg>
  </div>

  <div class="shield-wrap">
    <div class="shield">
      <div class="shield-k">K</div>
    </div>
  </div>
  <div class="wordmark">Kotwal</div>
  <div class="dv">कोतवाल</div>

  <div class="tag">AI security agent</div>
</div>
</body>
</html>
